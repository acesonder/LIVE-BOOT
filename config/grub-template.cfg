# GRUB Configuration Template
# For USB/SD bootable media

set timeout=10
set default=0

# Load modules
insmod all_video
insmod gfxterm
insmod png

# Set graphics mode
set gfxmode=auto
set gfxpayload=keep

# Terminal settings
terminal_input console
terminal_output gfxterm

# Theme
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# Main Menu Title
menuentry 'Live Boot OS Installer' {
    set root='(hd0,1)'
    echo 'Loading...'
}

# Ubuntu Boot
menuentry 'Ubuntu - Try or Install' {
    set isofile="/ubuntu.iso"
    loopback loop $isofile
    linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=$isofile quiet splash ---
    initrd (loop)/casper/initrd
}

menuentry 'Ubuntu - Safe Graphics' {
    set isofile="/ubuntu.iso"
    loopback loop $isofile
    linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=$isofile nomodeset quiet splash ---
    initrd (loop)/casper/initrd
}

# Linux Mint Boot
menuentry 'Linux Mint - Try or Install' {
    set isofile="/linuxmint.iso"
    loopback loop $isofile
    linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=$isofile quiet splash ---
    initrd (loop)/casper/initrd.lz
}

# Fedora Boot
menuentry 'Fedora - Try or Install' {
    set isofile="/fedora.iso"
    loopback loop $isofile
    linux (loop)/isolinux/vmlinuz root=live:CDLABEL=Fedora iso-scan/filename=$isofile rd.live.image
    initrd (loop)/isolinux/initrd.img
}

# Debian Boot
menuentry 'Debian - Try or Install' {
    set isofile="/debian.iso"
    loopback loop $isofile
    linux (loop)/live/vmlinuz boot=live iso-scan/filename=$isofile quiet splash
    initrd (loop)/live/initrd.img
}

# Utilities
menuentry 'Memory Test (Memtest86+)' {
    linux16 /boot/memtest86+.bin
}

menuentry 'Hardware Detection' {
    set isofile="/ubuntu.iso"
    loopback loop $isofile
    linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=$isofile quiet splash ---
    initrd (loop)/casper/initrd
}

# System Options
menuentry 'Boot from Hard Drive' {
    exit
}

menuentry 'Reboot' {
    reboot
}

menuentry 'Shutdown' {
    halt
}
