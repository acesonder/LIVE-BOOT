# Live Boot Installer Configuration File
# Edit this file to customize default settings

# Version
VERSION="1.0.0"

# Default directories
DEFAULT_DOWNLOAD_DIR="$HOME/Downloads/LiveBoot"
DEFAULT_ISO_DIR="/home/Downloads"
MOUNT_BASE="/tmp/liveboot-mount"

# Network configuration
DEFAULT_TFTP_ROOT="/srv/tftp"
DEFAULT_NFS_ROOT="/srv/nfs"
DEFAULT_PXE_CONFIG="/srv/tftp/pxelinux.cfg"

# Boot configuration
DEFAULT_TIMEOUT=10
DEFAULT_BOOT_MODE="UEFI"  # UEFI or LEGACY

# USB/SD settings
MIN_USB_SIZE_GB=8
RECOMMENDED_USB_SIZE_GB=16
DEFAULT_FILESYSTEM="FAT32"  # FAT32, NTFS, or exFAT

# Installation settings
MIN_DISK_SIZE_GB=25
RECOMMENDED_DISK_SIZE_GB=50
DEFAULT_PARTITION_SCHEME="GPT"  # GPT or MBR

# Network settings
DEFAULT_DHCP_START="192.168.1.100"
DEFAULT_DHCP_END="192.168.1.200"
PXE_TIMEOUT=300  # seconds

# Browser preferences (in order of preference)
BROWSER_PREFERENCE="firefox chromium google-chrome links w3m lynx"

# Download mirrors
UBUNTU_MIRROR="https://releases.ubuntu.com"
FEDORA_MIRROR="https://download.fedoraproject.org/pub/fedora/linux/releases"
DEBIAN_MIRROR="https://cdimage.debian.org/debian-cd/current"
MINT_MIRROR="https://mirrors.kernel.org/linuxmint"

# Recommended distributions
RECOMMENDED_DISTROS="Ubuntu LinuxMint Fedora Debian PopOS"

# Log settings
ENABLE_LOGGING=true
LOG_DIR="/var/log/liveboot"
LOG_FILE="$LOG_DIR/installer.log"
DEBUG_MODE=false

# UI settings
USE_COLOR=true
SHOW_WARNINGS=true
CONFIRM_DANGEROUS_OPS=true

# Advanced settings
ENABLE_SMART_CHECK=true
SECURE_WIPE=false  # Use secure wipe (slower)
VERIFY_ISO_INTEGRITY=true
AUTO_UNMOUNT=true

# HP-specific settings
HP_BIOS_KEY_BOOT="F9"
HP_BIOS_KEY_SETUP="F10"
HP_BIOS_KEY_RECOVERY="F11"

# Supported filesystems
SUPPORTED_FS="ext4 fat32 ntfs exfat btrfs xfs"

# Custom ISO locations (add your own paths)
CUSTOM_ISO_PATHS="/media /mnt /home/ISOs"

# PXE menu timeout (seconds)
PXE_MENU_TIMEOUT=30

# Network boot port
TFTP_PORT=69
NFS_PORT=2049

# Backup settings
CREATE_BACKUP=false
BACKUP_DIR="/backup/liveboot"

# Notification settings
NOTIFY_ON_COMPLETE=true
NOTIFY_ON_ERROR=true

# Safety settings
ALLOW_WIPE_INTERNAL_DISKS=false  # Extra safety
REQUIRE_CONFIRMATION=true
MAX_RETRIES=3

# Performance settings
DD_BLOCK_SIZE="1M"
COMPRESSION="gzip"  # gzip, xz, or none

# Update checking
CHECK_FOR_UPDATES=true
UPDATE_URL="https://github.com/acesonder/LIVE-BOOT"

# Help and documentation
DOCS_URL="https://github.com/acesonder/LIVE-BOOT/blob/main/docs/README.md"
ISSUE_URL="https://github.com/acesonder/LIVE-BOOT/issues"

# End of configuration
