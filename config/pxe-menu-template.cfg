# PXE Boot Menu Template
# Copy this to /srv/tftp/pxelinux.cfg/default on your PXE server

DEFAULT menu.c32
PROMPT 0
TIMEOUT 300
ONTIMEOUT local

MENU TITLE Live Boot PXE Server - HP Laptop Recovery
MENU BACKGROUND boot-background.png

# Local Boot (Default)
LABEL local
    MENU LABEL ^Boot from Local Drive
    MENU DEFAULT
    LOCALBOOT 0
    TEXT HELP
    Boot from the local hard drive.
    This is the default option.
    ENDTEXT

# Ubuntu Installation
LABEL ubuntu
    MENU LABEL Install ^Ubuntu 22.04 LTS
    KERNEL ubuntu/vmlinuz
    APPEND initrd=ubuntu/initrd boot=casper netboot=nfs nfsroot=SERVER_IP:/srv/nfs/ubuntu splash quiet ---
    TEXT HELP
    Install Ubuntu 22.04 LTS Desktop
    User-friendly Linux distribution
    Recommended for beginners
    ENDTEXT

LABEL ubuntu-server
    MENU LABEL Install Ubuntu ^Server
    KERNEL ubuntu-server/vmlinuz
    APPEND initrd=ubuntu-server/initrd boot=casper netboot=nfs nfsroot=SERVER_IP:/srv/nfs/ubuntu-server
    TEXT HELP
    Install Ubuntu Server (no GUI)
    For advanced users and servers
    ENDTEXT

# Linux Mint Installation
LABEL mint
    MENU LABEL Install Linux ^Mint
    KERNEL mint/vmlinuz
    APPEND initrd=mint/initrd boot=casper netboot=nfs nfsroot=SERVER_IP:/srv/nfs/mint splash quiet
    TEXT HELP
    Install Linux Mint
    Windows-like interface
    Easy transition from Windows
    ENDTEXT

# Fedora Installation
LABEL fedora
    MENU LABEL Install ^Fedora Workstation
    KERNEL fedora/vmlinuz
    APPEND initrd=fedora/initrd.img root=live:nfs://SERVER_IP/srv/nfs/fedora rd.live.image
    TEXT HELP
    Install Fedora Workstation
    Latest software packages
    Modern GNOME desktop
    ENDTEXT

# Debian Installation
LABEL debian
    MENU LABEL Install ^Debian
    KERNEL debian/vmlinuz
    APPEND initrd=debian/initrd.img boot=live netboot=nfs nfsroot=SERVER_IP:/srv/nfs/debian
    TEXT HELP
    Install Debian
    Stable and reliable
    Rock-solid foundation
    ENDTEXT

# Rescue and Utilities Section
MENU SEPARATOR

LABEL rescue
    MENU LABEL ^Rescue Mode (System Recovery)
    KERNEL rescue/vmlinuz
    APPEND initrd=rescue/initrd.img rescue/enable=true
    TEXT HELP
    Boot into rescue mode
    Fix broken installations
    Recover data
    ENDTEXT

LABEL memtest
    MENU LABEL ^Memory Test (Memtest86+)
    KERNEL memtest86+.bin
    TEXT HELP
    Test system memory for errors
    Useful for diagnosing hardware problems
    ENDTEXT

LABEL gparted
    MENU LABEL ^GParted Live (Partition Manager)
    KERNEL gparted/vmlinuz
    APPEND initrd=gparted/initrd.img boot=live config union=overlay username=user components locales= keyboard-layouts= ocs_live_run="ocs-live-general" ocs_live_extra_param="" ocs_live_keymap="" ocs_live_batch="no" net.ifnames=0 nosplash noprompt
    TEXT HELP
    Partition management and disk tools
    Create, resize, delete partitions
    ENDTEXT

# Hardware Detection
LABEL hdt
    MENU LABEL ^Hardware Detection Tool
    KERNEL hdt.c32
    TEXT HELP
    Detect hardware information
    View system components
    Check compatibility
    ENDTEXT

# Return to previous menu or exit
MENU SEPARATOR

LABEL exit
    MENU LABEL E^xit PXE Boot
    MENU EXIT
    TEXT HELP
    Exit the PXE boot menu
    System will attempt next boot device
    ENDTEXT
